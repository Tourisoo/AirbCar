name: CI Pipeline
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./frontend
      - name: Run frontend tests
        run: npm test
        working-directory: ./frontend
      - name: Build frontend Docker image
        run: docker build -t nextjs-app .
        working-directory: ./frontend
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/mydb
          REDIS_URL: redis://localhost:6379/0
      - name: Build backend Docker image
        run: docker build -t django-app .
        working-directory: ./backend
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Newman
        run: npm install -g newman
      - name: Run Newman tests
        run: newman run ./correct/path/to/postman_collection.json
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: airbcar_db
          POSTGRES_USER: airbcar_user
          POSTGRES_PASSWORD: amineamine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./backend
      - name: Install frontend dependencies
        working-directory: ./frontend # Make sure this matches your repo structure
        run: npm install --legacy-peer-deps
      - name: Run Django command
        run: |
          cd backend/airbcar_backend
          python manage.py test
        env:
          DATABASE_NAME: airbcar_db
          DATABASE_USER: airbcar_user
          DATABASE_PASSWORD: amineamine
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
