name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: airbcar_db
          POSTGRES_USER: airbcar_user
          POSTGRES_PASSWORD: amineamine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # redis:
      #   image: redis:7
      #   ports:
      #     - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432; do sleep 1; done

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Debug database configuration
        run: |
          cd backend/airbcar_backend
          echo "=== Environment Variables ==="
          echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
          echo "DB_HOST: $DB_HOST"
          echo "DB_NAME: $DB_NAME"
          echo "DB_USER: $DB_USER"
          echo ""
          echo "=== Django Settings Check ==="
          DJANGO_SETTINGS_MODULE=airbcar_backend.settings_ci_simple python -c "
          import os
          import sys
          sys.path.append('.')
          import django
          django.setup()
          from django.conf import settings
          print('Database HOST:', settings.DATABASES['default']['HOST'])
          print('Database NAME:', settings.DATABASES['default']['NAME'])
          print('Database USER:', settings.DATABASES['default']['USER'])
          print('Settings module:', settings.SETTINGS_MODULE)
          " || echo "Django setup failed"
        env:
          GITHUB_ACTIONS: true
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: airbcar_db
          DB_USER: airbcar_user
          DB_PASSWORD: amineamine
          DJANGO_SETTINGS_MODULE: airbcar_backend.settings_ci_simple

      - name: Test database connection
        run: |
          cd backend/airbcar_backend
          DJANGO_SETTINGS_MODULE=airbcar_backend.settings_ci_simple python -c "
          import os
          import sys
          sys.path.append('.')
          import django
          django.setup()
          from django.db import connection
          try:
              cursor = connection.cursor()
              cursor.execute('SELECT 1')
              print('Database connection successful!')
          except Exception as e:
              print(f'Database connection failed: {e}')
              sys.exit(1)
          "
        env:
          GITHUB_ACTIONS: true
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: airbcar_db
          DB_USER: airbcar_user
          DB_PASSWORD: amineamine
          DJANGO_SETTINGS_MODULE: airbcar_backend.settings_ci_simple

      - name: Run database migrations
        run: |
          cd backend/airbcar_backend
          python manage.py migrate --settings=airbcar_backend.settings_ci_simple
        env:
          GITHUB_ACTIONS: true
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: airbcar_db
          DB_USER: airbcar_user
          DB_PASSWORD: amineamine
          DJANGO_SETTINGS_MODULE: airbcar_backend.settings_ci_simple

      - name: Run backend tests
        run: |
          cd backend/airbcar_backend
          python manage.py test --settings=airbcar_backend.settings_ci_simple
        env:
          GITHUB_ACTIONS: true
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: airbcar_db
          DB_USER: airbcar_user
          DB_PASSWORD: amineamine
          DJANGO_SETTINGS_MODULE: airbcar_backend.settings_ci_simple

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Run frontend linting (non-blocking)
        run: |
          cd frontend
          npm run lint || true

      - name: Run frontend build
        run: |
          cd frontend
          npm run build
        env:
          ESLINT_NO_DEV_ERRORS: true
          CI: false