services:
  # Local database - only for local development
  db:
    image: postgres:14-alpine
    container_name: airb_postgres_db
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - AirbNet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    # profiles:
      # - local

  django-api:
    build: backend/
    ports:
      - "8000:8000"
    networks:
      - AirbNet
    env_file:
      - .env.local
    # environment:
    #   FIRST_RUN: ${FIRST_RUN:-1}
    #   LOAD_INITIAL_FIXTURE: ${LOAD_INITIAL_FIXTURE:-1}
    # Conditionally depend on db only if using local profile
    # depends_on:
    #   db:
    #     condition: service_healthy
    #     required: false
    restart: unless-stopped

  next-app:
    build: frontend/
    ports:
      - "3000:3000"
    networks:
      - AirbNet
    env_file:
      - .env.local
    environment:
      DJANGO_API_URL: http://django-api:8000 
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=4096
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - django-api
    restart: unless-stopped

networks:
  AirbNet:
    driver: bridge

volumes:
  postgres_data: