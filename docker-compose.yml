
services:
  web:
    build: backend/
    ports:
      - "8000:8000"
    networks:
      - airbo
    environment:
      DATABASE_NAME: postgres
      DATABASE_USER: postgres.wtbmqtmmdobfvvecinif
      DATABASE_PASSWORD: Mayache+123455
      DATABASE_HOST: aws-1-eu-north-1.pooler.supabase.com
      DATABASE_PORT: 5432
      DJANGO_SUPERUSER_USERNAME: amine
      DJANGO_SUPERUSER_EMAIL: amine@a.com
      DJANGO_SUPERUSER_PASSWORD: amineamine
      LOAD_INITIAL_FIXTURE: "1"
    # depends_on removed, no local db
    restart: unless-stopped

  app:
    build: frontend/
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_DJANGO_API_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-secret-key-here-replace-in-production
      - DATABASE_URL=postgresql://postgres.wtbmqtmmdobfvvecinif:Mayache+123455@aws-1-eu-north-1.pooler.supabase.com:5432/postgres

      # Override these in .env file or docker-compose.override.yml
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-tmp_env_var_name_by_amine}
      # - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-tmp_env_var_name_by_amine}
      # - EMAIL_SERVER_USER=${EMAIL_SERVER_USER:-tmp_env_var_name_by_amine}
      # - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD:-tmp_env_var_name_by_amine}
      # - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST:-smtp.gmail.com}
      # - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT:-587}
      # - EMAIL_FROM=${EMAIL_FROM:-tmp_env_var_name_by_amine}
    volumes:
      # Mount the source code for development (hot reload)
      - ./frontend:/app
      # Preserve node_modules in container
      - /app/node_modules
    networks:
      - airbo
    restart: unless-stopped


networks:
  airbo:
    driver: bridge