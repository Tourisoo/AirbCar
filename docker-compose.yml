services:
  db:
    image: postgres:14-alpine
    container_name: airb_postgres_db
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - AirbNet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  django-api:
    build: backend/
    ports:
      - "8000:8000"
    networks:
      - AirbNet
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  next-app:
    build: frontend/
    ports:
      - "3000:3000"
    networks:
      - AirbNet
    env_file:
      - .env.local
    environment:
      DJANGO_API_URL: http://django-api:8000 
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=4096
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - django-api
    restart: unless-stopped

networks:
  AirbNet:
    driver: bridge

volumes:
  postgres_data: