services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: airbcar_postgres
    environment:
      POSTGRES_DB: airbcar_db
      POSTGRES_USER: airbcar_user
      POSTGRES_PASSWORD: amineamine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - airbcar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbcar_user -d airbcar_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Service (Django/Python)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbcar_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_NAME: airbcar_db
      DATABASE_USER: airbcar_user
      DATABASE_PASSWORD: amineamine
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DEBUG: 1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - airbcar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (Next.js)
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airbcar_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXTAUTH_URL=http://localhost:3000
      - API_BASE_URL=http://backend:8000
      # Database connection for Prisma (if used)
      - DATABASE_URL=postgresql://airbcar_user:amineamine@db:5432/airbcar_db
      # Override these in .env file or docker-compose.override.yml
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-temp-secret-for-dev}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER:-}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD:-}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST:-smtp.gmail.com}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT:-587}
      - EMAIL_FROM=${EMAIL_FROM:-}
    volumes:
      # Mount source code for development (hot reload)
      - ./frontend:/app
      # Preserve node_modules in container
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
      - db
    networks:
      - airbcar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  airbcar-network:
    driver: bridge

volumes:
  pgdata: