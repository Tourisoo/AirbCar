version: '3'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: airbcar_db
      POSTGRES_USER: airbcar_user
      POSTGRES_PASSWORD: amineamine
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: Backend/
    ports:
      - "8000:8000"
    networks:
      - airbo
    environment:
      DATABASE_NAME: airbcar_db
      DATABASE_USER: airbcar_user
      DATABASE_PASSWORD: amineamine
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      - db
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./prisma/dev.db
      - NEXTAUTH_URL=http://localhost:8000
      # Override these in .env file or docker-compose.override.yml
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER:-}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD:-}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST:-smtp.gmail.com}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT:-587}
      - EMAIL_FROM=${EMAIL_FROM:-}
    volumes:
      # Mount the source code for development (hot reload)
      - ./frontend:/app
      # Preserve node_modules in container
      - /app/node_modules
      # Persist database
      - ./frontend/prisma:/app/prisma
    networks:
      - airbo
    restart: unless-stopped

volumes:
  pgdata:

networks:
  airbo:
    driver: bridge